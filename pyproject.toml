[project]
name = "godfather"
version = "0.1.0"
description = "Godfather — 本地特化小模型训练工作台 (M0: Markdown→LaTeX 无训练闭环)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
]

[project.scripts]
godfather = "godfather.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godfather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的 Depends() 默认值是官方推荐的写法，不是 bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Form", "fastapi.File"]
